<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">

```
<style>
    .search-container {
        max-width: 1100px;
        margin: 50px auto;
        padding: 20px;
    }

    .search-box {
        background: #ffffff;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        margin-bottom: 30px;
    }

    .search-box h1 {
        margin-bottom: 10px;
    }

    .search-form {
        display: grid;
        grid-template-columns: repeat(3, 1fr) auto;
        gap: 15px;
        align-items: end;
        margin-top: 25px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group label {
        font-weight: 600;
    }

    .form-group input {
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
    }

    .search-btn {
        padding: 13px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 15px;
    }

    .results-title {
        margin: 25px 0 15px;
    }

    .ride-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .ride-header {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 20px;
    }

    .route {
        font-size: 20px;
        font-weight: 700;
    }

    .price {
        font-size: 20px;
        font-weight: 700;
    }

    .ride-info {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 20px;
    }

    .info-item {
        background: #f7f7f7;
        padding: 12px;
        border-radius: 8px;
    }

    .info-label {
        font-size: 12px;
        color: #666;
        display: block;
        margin-bottom: 5px;
    }

    .book-btn {
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
    }

    .message {
        padding: 15px;
        border-radius: 8px;
        margin-top: 15px;
        display: none;
    }

    .loading {
        text-align: center;
        padding: 20px;
    }

    @media (max-width: 800px) {
        .search-form {
            grid-template-columns: 1fr;
        }

        .ride-info {
            grid-template-columns: 1fr 1fr;
        }

        .ride-header {
            flex-direction: column;
        }
    }
</style>
```

</head>

    <nav class="navbar">

    <a href="dashboard.html" class="login-btn">

</header>

<main class="search-container">

```
<section class="search-box">
    <h1>Find a Ride</h1>
    <p>Search for available rides from your location to your destination.</p>

    <form id="searchForm" class="search-form">

        <div class="form-group">
            <label for="startLocation">From</label>
            <input
                type="text"
                id="startLocation"
                placeholder="Vijayawada"
                required
            >
        </div>

        <div class="form-group">
            <label for="destination">To</label>
            <input
                type="text"
                id="destination"
                placeholder="Hyderabad"
                required
            >
        </div>

        <div class="form-group">
            <label for="travelDate">Travel Date</label>
            <input
                type="date"
                id="travelDate"
                required
            >
        </div>

        <button type="submit" class="primary-btn search-btn">
            Search
        </button>

    </form>

    <div id="message" class="message"></div>
</section>

<section>
    <h2 class="results-title">Available Rides</h2>

    <div id="results">
        <p>Enter your journey details and click Search.</p>
    </div>
</section>
```

</main>

<script>

const API_BASE_URL = "http://localhost:8080";

const searchForm = document.getElementById("searchForm");
const results = document.getElementById("results");
const message = document.getElementById("message");

searchForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const startLocation =
        document.getElementById("startLocation").value.trim();

    const destination =
        document.getElementById("destination").value.trim();

    const travelDate =
        document.getElementById("travelDate").value;

    results.innerHTML = '<div class="loading">Searching rides...</div>';

    message.style.display = "none";

    try {

        const url =
            `${API_BASE_URL}/api/rides/search?` +
            `startLocation=${encodeURIComponent(startLocation)}` +
            `&destination=${encodeURIComponent(destination)}` +
            `&travelDate=${encodeURIComponent(travelDate)}`;

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Unable to search rides.");
        }

        const rides = await response.json();

        displayRides(rides);

    } catch (error) {

        console.error(error);

        results.innerHTML = "";

        message.textContent =
            "Unable to connect to the backend. Please make sure Spring Boot is running on port 8080.";

        message.style.display = "block";

    }

});


function displayRides(rides) {

    if (!rides || rides.length === 0) {

        results.innerHTML = `
            <div class="ride-card">
                <h3>No rides found</h3>
                <p>
                    No rides are available for the selected route and date.
                </p>
            </div>
        `;

        return;
    }

    results.innerHTML = rides.map(ride => {

        return `
            <div class="ride-card">

                <div class="ride-header">

                    <div class="route">
                        🚗 ${escapeHtml(ride.startLocation)}
                        →
                        ${escapeHtml(ride.destination)}
                    </div>

                    <div class="price">
                        ₹${ride.pricePerPassenger}
                    </div>

                </div>

                <div class="ride-info">

                    <div class="info-item">
                        <span class="info-label">Date</span>
                        ${escapeHtml(ride.travelDate || "N/A")}
                    </div>

                    <div class="info-item">
                        <span class="info-label">Departure</span>
                        ${escapeHtml(ride.departureTime || "N/A")}
                    </div>

                    <div class="info-item">
                        <span class="info-label">Available Seats</span>
                        ${escapeHtml(ride.availableSeats ?? "N/A")}
                    </div>

                    <div class="info-item">
                        <span class="info-label">Ride ID</span>
                        ${escapeHtml(ride.rideId)}
                    </div>

                </div>

                <button
                    class="primary-btn book-btn"
                    onclick="bookRide(${ride.rideId})">
                    Book Ride
                </button>

            </div>
        `;

    }).join("");

}


async function bookRide(rideId) {

    const passengerId = 1;
    const seatsBooked = 1;

    try {

        const response = await fetch(
            `${API_BASE_URL}/api/bookings`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    rideId: rideId,
                    passengerId: passengerId,
                    seatsBooked: seatsBooked
                })
            }
        );

        if (!response.ok) {

            throw new Error(
                "Booking failed. Server returned " + response.status
            );

        }

        const booking = await response.json();

        alert(
            "Ride booked successfully! Booking ID: " +
            booking.bookingId
        );

    } catch (error) {

        console.error(error);

        alert(
            "Booking could not be completed. " +
            "Please make sure the backend is running."
        );

    }

}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>
